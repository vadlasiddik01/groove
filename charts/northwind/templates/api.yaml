apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.registry }}/northwind-api:{{ .Values.images.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: northwind-config
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
          resources:
{{ toYaml .Values.resources.api | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 3000
      name: http
      targetPort: 3000
      nodePort: 30080
