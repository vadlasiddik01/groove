apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    name: worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: orders
        listLength: {{ .Values.autoscaling.listLength | quote }}
        activationListLength: "1"
