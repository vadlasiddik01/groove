apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: {{ .Values.images.registry }}/northwind-worker:{{ .Values.images.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.worker.port }}
          envFrom:
            - configMapRef:
                name: northwind-config
          env:
            - name: PORT
              value: "3001"
            - name: CHAOS_MEMORY_LEAK
              value: {{ .Values.worker.chaos.memoryLeak | quote }}
            - name: CHAOS_HANG
              value: {{ .Values.worker.chaos.hang | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
{{ toYaml .Values.resources.worker | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
