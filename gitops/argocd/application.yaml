apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: northwind
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:3000/CHANGE_ME/northwind-logistics.git
    targetRevision: main
    path: charts/northwind
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: northwind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
